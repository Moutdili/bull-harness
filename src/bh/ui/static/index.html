<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bull-harness</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header>
  <div class="brand">bull<span>·</span>harness</div>
  <nav id="tabs">
    <button data-tab="dash" class="on">Dashboard</button>
    <button data-tab="live">Live</button>
    <button data-tab="findings">Findings <b id="n-find"></b></button>
    <button data-tab="submit">À soumettre <b id="n-submit"></b></button>
    <button data-tab="blockers">Pistes bloquées <b id="n-block"></b></button>
    <button data-tab="identities">Identités</button>
    <button data-tab="traffic">Trafic</button>
    <button data-tab="board">Board</button>
    <button data-tab="lineage">Lignée</button>
    <button data-tab="metrics">Métriques</button>
    <button data-tab="programs">Programmes</button>
  </nav>
  <div id="stack" class="stack"></div>
</header>
<main>
  <section id="dash" class="tab on"></section>
  <section id="live" class="tab"></section>
  <section id="findings" class="tab"></section>
  <section id="submit" class="tab"></section>
  <section id="blockers" class="tab"></section>
  <section id="identities" class="tab"></section>
  <section id="traffic" class="tab"></section>
  <section id="board" class="tab"></section>
  <section id="lineage" class="tab"></section>
  <section id="metrics" class="tab"></section>
  <section id="programs" class="tab"></section>
</main>
<div id="drawer" class="drawer hidden"><div class="drawer-in"><button id="drawer-x" class="x">✕</button><div id="drawer-body"></div></div></div>
<div id="toast" class="toast hidden"></div>
</body>
</html>
