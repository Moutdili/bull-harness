# Local practice lab (OWASP Juice Shop, intentionally vulnerable). Reachable only through the gate.
schema: 1
program: lab-juiceshop
platform: local
automation_allowed: true
self_signup: true  # the harness creates its own lab accounts: `bh accounts enroll scopes/lab/juiceshop.yaml`
max_rps: 20
required_headers: {X-Bug-Bounty: bull-harness-lab}
in_scope:
  - {value: "10.231.0.10/32", note: "Juice Shop, http://10.231.0.10:3000"}
  - {value: "juiceshop.lab", note: "not resolvable; use the IP"}
# data-free host the hunter may cite and load (D27): GET/HEAD/OPTIONS only, nothing of ours attached
payload_hosts: [example.org]
out_of_scope: []
forbidden_vulns: [dos]
# Test accounts. Juice Shop keeps its DB in memory: after a restart, `bh accounts refresh` signs the same accounts
# up again. whoami answers 200 even without a session ({"user":{}}): the probe also expects the account's email.
identities:
  - name: user-a
    probe: {url: "http://10.231.0.10:3000/rest/user/whoami", status: 200, expect: '"email"'}
    enroll: &juiceshop
      email: "bh-{name}-{rand}@lab.local"
      signup:
        method: POST
        url: http://10.231.0.10:3000/api/Users
        json:
          email: "{email}"
          password: "{password}"
          passwordRepeat: "{password}"
          securityQuestion: {id: 1}
          securityAnswer: "{answer}"
      login:
        method: POST
        url: http://10.231.0.10:3000/rest/user/login
        json: {email: "{email}", password: "{password}"}
      token: authentication.token
      headers: {Authorization: "Bearer {token}", Cookie: "token={token}"}
  - name: user-b
    probe: {url: "http://10.231.0.10:3000/rest/user/whoami", status: 200, expect: '"email"'}
    enroll: *juiceshop
  # Browser login (bh-login container, headless Chromium behind the gate): the account is created over HTTP, then the
  # Angular login form is filled; the session is the JWT the app keeps in localStorage `token`, sent as a bearer,
  # plus the context's cookies (Juice Shop copies the token into a `token` cookie).
  - name: user-c
    probe: {url: "http://10.231.0.10:3000/rest/user/whoami", status: 200, expect: '"email"'}
    enroll:
      kind: browser
      email: "bh-{name}-{rand}@lab.local"
      signup:
        method: POST
        url: http://10.231.0.10:3000/api/Users
        json:
          email: "{email}"
          password: "{password}"
          passwordRepeat: "{password}"
          securityQuestion: {id: 1}
          securityAnswer: "{answer}"
      steps:
        - {goto: "http://10.231.0.10:3000/#/login"}
        - {click: "button[aria-label='Close Welcome Banner']", optional: true, timeout: 5}
        - {click: "a[aria-label='dismiss cookie message']", optional: true, timeout: 3}
        - {fill: "#email", value: "{email}"}
        - {fill: "#password", value: "{password}"}
        - {click: "#loginButton"}
        - {wait_for: {url: "#/search"}}
      capture:
        local_storage: {token: {Authorization: "Bearer {value}"}}
notes: "Training target at http://10.231.0.10:3000 . Goal: validate the harness end to end (recon, finding, PoC, notes). Known lab quirk: /ftp sends a Content-Length 12 bytes too long, so the gate answers 502 on it; fetch individual /ftp/<file> instead."
