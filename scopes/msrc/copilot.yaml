# Microsoft MSRC, Copilot (consumer, copilot.microsoft.com) with two personal test accounts of ours.
# Rules: docs/research/15-msrc-premier-programme.md (own accounts only, no excessive automated traffic, no DoS,
# stop at the proof, human review of every report). The login hosts below are here for enrollment only and are NOT
# targets: a hunt on this file must wait for enrollment-only hosts in the gate (see notes).
schema: 1
program: msrc-copilot
platform: msrc
automation_allowed: true
scanners_allowed: false
self_signup: false
max_rps: 2
forbidden_vulns: [dos]
in_scope:
  - {value: "copilot.microsoft.com", note: "target (redirects to copilot.com)"}
  - {value: "copilot.com", note: "target: Copilot consumer web"}
  - {value: "login.live.com", note: "login only, not a target"}
  - {value: "login.microsoft.com", note: "login only, not a target"}
  - {value: "fpt.live.com", note: "login anti-fraud fingerprint, not a target"}
  - {value: "account.live.com", note: "login only, not a target"}
  - {value: "login.microsoftonline.com", note: "login only, not a target"}
  - {value: "*.msftauth.net", note: "login page assets, not a target"}
  - {value: "*.msauth.net", note: "login page assets, not a target"}
  - {value: "res.cdn.office.net", note: "Copilot app assets (JS), not a target"}
  - {value: "uhf.microsoft.com", note: "Copilot page assets, not a target"}
  - {value: "wcpstatic.microsoft.com", note: "page assets, not a target"}
out_of_scope: []
identities:
  - name: user-a
    role: member
    tenant: A
    enroll:
      kind: browser
      steps:
        - {goto: "https://login.live.com/"}
        - {fill: "input[type=email]", value: "{email}"}
        - {click: "button[type=submit], input[type=submit]"}
        - {click: "text=Use your password", optional: true, timeout: 8}
        - {fill: "input[type=password]", value: "{password}"}
        - {click: "button[type=submit], input[type=submit]"}
        - {email_code: "input[name=otc], input[autocomplete=one-time-code]", from: "microsoft.com", optional: true, timeout: 10}
        - {click: "button[type=submit], input[type=submit]", optional: true, timeout: 8}
        - {goto: "https://copilot.microsoft.com/"}
        - {wait_for: {url: "copilot"}}
        - {click: "button:has-text('Reject')", optional: true, timeout: 8}
        - {click: "button:has-text('Sign in')", optional: true, timeout: 20}
        - {click: "text=Sign in with Microsoft", optional: true, timeout: 10}
        - {click: "[data-test-id], div[role=button]:has-text('@')", optional: true, timeout: 8}
        - {wait_for: {url: "copilot.com"}, timeout: 40}
      capture: {cookies: true, authorization: true}
  - name: user-b
    role: member
    tenant: B
    enroll:
      kind: browser
      steps:
        - {goto: "https://login.live.com/"}
        - {fill: "input[type=email]", value: "{email}"}
        - {click: "button[type=submit], input[type=submit]"}
        - {click: "text=Use your password", optional: true, timeout: 8}
        - {fill: "input[type=password]", value: "{password}"}
        - {click: "button[type=submit], input[type=submit]"}
        - {email_code: "input[name=otc], input[autocomplete=one-time-code]", from: "microsoft.com", optional: true, timeout: 10}
        - {click: "button[type=submit], input[type=submit]", optional: true, timeout: 8}
        - {goto: "https://copilot.microsoft.com/"}
        - {wait_for: {url: "copilot"}}
        - {click: "button:has-text('Reject')", optional: true, timeout: 8}
        - {click: "button:has-text('Sign in')", optional: true, timeout: 20}
        - {click: "text=Sign in with Microsoft", optional: true, timeout: 10}
        - {click: "[data-test-id], div[role=button]:has-text('@')", optional: true, timeout: 8}
        - {wait_for: {url: "copilot.com"}, timeout: 40}
      capture: {cookies: true, authorization: true}
notes: "MSRC Copilot bounty (https://www.microsoft.com/en-us/msrc/bounty-ai). Test only our own two personal accounts. Cross-user impact is what pays (see .claude/skills/msrc-ai-bug-bounty). Enrollment test only for now: login hosts must become enrollment-only before any hunt."
