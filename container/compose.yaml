# bull-harness runtime. Podman rootless + podman-compose (docker compose compatible).
#   sandbox : internal network, NO route out. agent + judge + login + browser + gate.
#   egress  : normal network. gate only.
#   lab     : internal network for local practice targets (profile "lab"). gate only.
#   oob     : the out-of-band listener alone (profile "oob"), its port published on the host's 127.0.0.1 only.
# The gate is therefore the only path from the agent (and the judge, and the login browser) to anything.
# The lineage's memory and archives (var/lineage) and the lab's sources (lab/) stay on the host: no container
# mounts them (tests/test_w2_runner.py reads this file).
name: bh

# What the agent and the judge share: same image, same gate (proxy + Claude API relay), same environment.
x-sandbox-environment: &sandbox_env
  # placeholder only: the gate relay injects the real token (src/bh/gate/addon.py, RELAY_PORT)
  CLAUDE_CODE_OAUTH_TOKEN: sk-ant-oat01-bh-relay-placeholder-the-real-token-lives-in-the-gate-only
  ANTHROPIC_BASE_URL: http://gate:8081
  HTTP_PROXY: http://gate:8080
  HTTPS_PROXY: http://gate:8080
  http_proxy: http://gate:8080
  https_proxy: http://gate:8080
  NO_PROXY: localhost,127.0.0.1,gate
  no_proxy: localhost,127.0.0.1,gate
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
  REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
  CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  DISABLE_AUTOUPDATER: "1"
  BH_GATE: http://gate:8080

networks:
  sandbox:
    internal: true
  egress: {}
  lab:
    internal: true
    ipam:
      config:
        - subnet: 10.231.0.0/24
  # the out-of-band listener alone (profile `oob`); not internal, so the host can publish its port on 127.0.0.1
  oob: {}

volumes:
  browser-profile: {}

services:
  gate:
    build:
      context: ./gate
      dockerfile: Containerfile
    image: localhost/bh-gate:dev
    container_name: bh-gate
    command:
      - mitmdump
      - --mode=regular@8080
      # Claude API relay: the agent talks to gate:8081 with a placeholder token, the gate swaps in the
      # real OAuth token (which exists only in this container) and forwards to api.anthropic.com
      - --mode=reverse:https://api.anthropic.com@8081
      - --set=bh_state=/state
      - --set=flow_detail=0
      - -s
      - /opt/bh/src/bh/gate/addon.py
    env_file:
      - ../secrets/agent.env  # CLAUDE_CODE_OAUTH_TOKEN: gate only, never the agent
    environment:
      PYTHONPATH: /opt/bh/src
      BH_CA_PUB: /gate-ca
    volumes:
      - ../src:/opt/bh/src:ro,z
      - ../var/gate/conf:/home/mitmproxy/.mitmproxy:Z
      - ../var/state:/state:z
      - ../var/gate-ca:/gate-ca:z
    networks: [sandbox, egress, lab]
    restart: unless-stopped
    # hardening: the image entrypoint drops to the mitmproxy user (needs SETUID/SETGID once)
    security_opt: [no-new-privileges]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    pids_limit: 512
    mem_limit: 2g

  agent:
    image: localhost/bh-agent:dev
    container_name: bh-agent
    depends_on: [gate]
    init: true  # reaps the processes the agent's tools leave behind (PID 1 is otherwise `sleep`)
    # hardening: root is only needed by the entrypoint (CA install, chown /work, drop to hunter) and by
    # the host's kill_agent; tools that want raw sockets (SYN scans) stay impossible on purpose
    security_opt: [no-new-privileges]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, KILL]
    pids_limit: 2048
    mem_limit: 6g
    # BH_BROWSER_TOKEN (secrets/browser.env, made by `bh up`): the agent's key to bh-browser's narrow API
    env_file:
      - ../secrets/browser.env
    environment:
      <<: *sandbox_env
      NO_PROXY: localhost,127.0.0.1,gate,browser
      no_proxy: localhost,127.0.0.1,gate,browser
      BH_BROWSER_URL: http://browser:8790
    volumes:
      - ../var/gate-ca:/gate-ca:ro,z
      - ../var/work:/work:z
      - ./agent/bin:/opt/bh/bin:ro,z
      - ./agent/hooks:/opt/bh/hooks:ro,z
      # sandbox code only (bh.agent): the rest of the harness stays out of the agent's reach
      - ../src/bh/__init__.py:/opt/bh/lib/bh/__init__.py:ro,z
      - ../src/bh/agent:/opt/bh/lib/bh/agent:ro,z
      # method and program cards, read on demand with the Read tool (audit I7); the task names the pinned ones
      - ../src/bh/cards:/opt/bh/cards:ro,z
      # D18: the hunter's skills, read-only; each segment links the ones its program allows into the session's
      # fresh session HOME (bh.runner.run.link_skills). The judge mounts none.
      - ../src/bh/skills:/opt/bh/skills:ro,z
      # T49: the public code a scope declares (`whitebox:`), staged by the runner before each segment, read-only
      - ../var/whitebox-mount:/opt/bh/whitebox:ro,z
      # pinned nuclei templates, fetched on the host: the gate blocks GitHub
      - ../var/tools/nuclei-templates:/opt/bh/nuclei-templates:ro,z
    networks: [sandbox]
    restart: unless-stopped

  # The verifier (src/bh/verify.py): replay + claude -p as the Unix user `judge`, in a container of its own.
  # It reads target answers (prompt injection), so it shares nothing with the hunter but the image and the gate:
  # its own /work (var/judge, never var/work), its own processes, /tmp and trust store. The gate's relay admits
  # it by name (BH_JUDGE_HOST, default `judge`). No nuclei templates: the judge does not scan.
  judge:
    image: localhost/bh-agent:dev
    container_name: bh-judge
    depends_on: [gate]
    init: true
    security_opt: [no-new-privileges]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, KILL]
    pids_limit: 1024
    mem_limit: 4g
    environment: *sandbox_env
    volumes:
      - ../var/gate-ca:/gate-ca:ro,z
      - ../var/judge:/work:Z
      - ./agent/bin:/opt/bh/bin:ro,z
      - ./agent/hooks:/opt/bh/hooks:ro,z
      - ../src/bh/__init__.py:/opt/bh/lib/bh/__init__.py:ro,z
      - ../src/bh/agent:/opt/bh/lib/bh/agent:ro,z
    networks: [sandbox]
    restart: unless-stopped

  # Independent auditor that runs the code it reviews (container/audit, tools/audit-exec.sh). Profile `audit`: started
  # only by that script. Sandbox network only; the gate relays its Claude calls by name (role `audit`). It sees a COPY
  # of the code under /work, never the host tree, secrets/ or var/state; no browser token, no identity.
  audit:
    image: localhost/bh-audit:dev
    container_name: bh-audit
    profiles: [audit]
    depends_on: [gate]
    init: true
    security_opt: [no-new-privileges]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, KILL]
    pids_limit: 2048
    mem_limit: 6g
    environment:
      <<: *sandbox_env
      UV_PROJECT_ENVIRONMENT: /opt/audit-venv
      UV_OFFLINE: "1"
      UV_NO_SYNC: "1"
      PYTHONPATH: /work/repo/src  # the copy under review is the code the tests import (the venv holds the deps only)
    volumes:
      - ../var/gate-ca:/gate-ca:ro,z
      - ../var/audit/current:/work:Z
    command: ["sleep", "infinity"]
    networks: [sandbox]

  # Browser logins (src/bh/accounts/browser.py): headless Chromium driven by the host through `podman exec -i`,
  # the script and the credential on stdin. Same image as the agent, sandbox network only, so every request of a
  # login goes through the gate (scope, rate, required headers). No /work (it never sees the hunter's files), no
  # Claude relay (no ANTHROPIC_BASE_URL; the gate admits only the agent and the judge by name), no secret at
  # rest: each login gets a fresh HOME/profile under /tmp/bh-login-*, deleted after it (stack.reset_login).
  # The gate CA is trusted per login in that HOME's NSS database.
  login:
    image: localhost/bh-agent:dev
    container_name: bh-login
    depends_on: [gate]
    init: true
    security_opt: [no-new-privileges]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, KILL]
    pids_limit: 512
    mem_limit: 2g
    environment:
      HTTP_PROXY: http://gate:8080
      HTTPS_PROXY: http://gate:8080
      http_proxy: http://gate:8080
      https_proxy: http://gate:8080
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
    volumes:
      - ../var/gate-ca:/gate-ca:ro,z
    networks: [sandbox]
    restart: unless-stopped

  # Persistent headful browser with a remote screen (src/bh/browser_service, docs/research/18): for a human
  # challenge (Turnstile) that Mio solves himself, in the same browser the agent uses. Profile `browser`: `bh up`
  # does not start it, `bh browser up` does. Same image, sandbox network only, every request through the gate.
  # Inside: Xvfb, the distribution's Chromium (headful, stock flags, no user agent of ours) with its profile in the
  # volume `browser-profile`, CDP and x11vnc on the container's loopback only. The agent reaches the narrow API on
  # :8790 with BH_BROWSER_TOKEN; the host reaches the control socket and the screen through `podman exec -i` only:
  # no port is published, the UI relays the screen at /captcha/ behind its login.
  browser:
    image: localhost/bh-agent:dev
    container_name: bh-browser
    profiles: [browser]
    depends_on: [gate]
    init: true
    security_opt: [no-new-privileges]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, KILL]
    pids_limit: 1024
    mem_limit: 3g
    shm_size: 512m
    env_file:
      - ../secrets/browser.env
    environment:
      HTTP_PROXY: http://gate:8080
      HTTPS_PROXY: http://gate:8080
      http_proxy: http://gate:8080
      https_proxy: http://gate:8080
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
    volumes:
      - ../var/gate-ca:/gate-ca:ro,z
      - browser-profile:/profile
      # the controller and what it imports, read-only; nothing else of the harness
      - ../src/bh/__init__.py:/opt/bh/lib/bh/__init__.py:ro,z
      - ../src/bh/redact.py:/opt/bh/lib/bh/redact.py:ro,z
      - ../src/bh/browser_service:/opt/bh/lib/bh/browser_service:ro,z
    networks: [sandbox]
    command: [python3, -I, -c, "import sys;sys.path.insert(0,'/opt/bh/lib');from bh.browser_service.__main__ import main;main(sys.argv[1:])", serve]
    restart: unless-stopped

  # Out-of-band listener (src/bh/oob/listener.py, T23): what a target's server sends to `https://<name>/c/<canary>`,
  # kept as one line {ts, proto, token, src}. Profile `oob`: no command of the harness starts it; the orchestrator
  # does, opens Tailscale Funnel toward the host's 127.0.0.1:${BH_OOB_PORT:-8792} at the start of a run and resets it
  # after. Its own network (never `sandbox`: no client of the sandbox may reach it, the gate opens nothing for it), its
  # port published on the host's loopback only, one volume: the journal's directory, read by bh.runner.observation
  # through the scope's `support` entry of kind `oob` (`journal: <this home>/var/oob/oob.jsonl`).
  oob:
    build:
      context: ../src
      dockerfile: ../container/oob/Containerfile
    image: localhost/bh-oob:dev
    container_name: bh-oob
    profiles: [oob]
    user: "10001:10001"
    # the host's user is the container's 10001: the journal it writes stays the host user's, readable by the host
    userns_mode: "keep-id:uid=10001,gid=10001"
    read_only: true
    security_opt: [no-new-privileges]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 128m
    ports:
      - "127.0.0.1:${BH_OOB_PORT:-8792}:8792"
    volumes:
      - ../var/oob:/journal:Z
    networks: [oob]
    restart: unless-stopped

  # Local practice target: `podman-compose -f container/compose.yaml --profile lab up -d juiceshop`
  juiceshop:
    # pinned: the lab is a regression bench, its vulnerabilities must not change between versions
    image: docker.io/bkimminich/juice-shop@sha256:69e0504ca940fe19dc6b0405d5536c9475014cc28719e795602d95e83b8d2207
    container_name: bh-lab-juiceshop
    profiles: [lab]
    networks:
      lab:
        ipv4_address: 10.231.0.10
    restart: unless-stopped
